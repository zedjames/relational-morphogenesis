name: Verify released paper results

on:
  push:
  pull_request:

jobs:
  runtime-diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"
      - name: Inspect fixed CPU-kernel compatibility without changing frozen authorities
        env:
          OPENBLAS_NUM_THREADS: "1"
          OPENBLAS_VERBOSE: "2"
          OMP_NUM_THREADS: "1"
        run: |
          python -m pip install -r papers/03-overlapping-local-relational-geometry/analysis/requirements.txt
          for runtime_core in SANDYBRIDGE HASWELL ZEN; do
            echo "Diagnostic kernel: $runtime_core"
            OPENBLAS_CORETYPE="$runtime_core" python papers/03-overlapping-local-relational-geometry/analysis/diagnose_replay_runtime.py
          done
  numerical:
    # Preserve the frozen sampler's Apple Silicon/Accelerate execution backend.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Verify all released paper surfaces
        env:
          OPENBLAS_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python -m pip install -r papers/03-overlapping-local-relational-geometry/reproducibility/requirements.txt
          python papers/03-overlapping-local-relational-geometry/analysis/verify_git_payloads.py
          python papers/03-overlapping-local-relational-geometry/analysis/diagnose_replay_runtime.py
          make verify
  documents:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"
      - name: Verify public payloads and document structure
        run: |
          python -m pip install -r papers/03-overlapping-local-relational-geometry/analysis/requirements.txt
          python papers/01-directional-stability/analysis/verify_release.py
          python papers/02-present-state-resolution-and-lineage-history/analysis/verify_release.py
          python papers/03-overlapping-local-relational-geometry/analysis/verify_git_payloads.py
          python papers/03-overlapping-local-relational-geometry/analysis/verify_artifacts.py
          python papers/03-overlapping-local-relational-geometry/analysis/verify_release.py
      - name: Compile approved Paper 3 manuscript and detached supplement
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended texlive-science latexmk
          python papers/03-overlapping-local-relational-geometry/analysis/verify_documents.py --engine latexmk --output "$RUNNER_TEMP/paper3-documents"
